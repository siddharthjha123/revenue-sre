services:
  db:
    image: postgres:16-alpine
    container_name: revenue_sre_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revenue_sre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-revenue_sre}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "backend.app.workers"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://revenue_sre:replace-with-a-local-password@db:5432/revenue_sre}
      WORKER_HEARTBEAT_PATH: /app/.runtime/revenue-sre-worker.heartbeat
      WORKER_METRICS_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9101:9101"
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-m", "backend.app.workers.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
