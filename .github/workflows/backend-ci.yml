name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revenue_sre
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: revenue_sre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revenue_sre -d revenue_sre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://revenue_sre:ci-only-password@localhost:5432/revenue_sre_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Detect model and migration drift
        run: python -m alembic check

      - name: Test
        run: python -m pytest -v
